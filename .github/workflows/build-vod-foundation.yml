name: Build Movhika VOD Test Image

on:
  push:
    branches:
      - codex/vod-foundation
  workflow_dispatch:
    inputs:
      source_ref:
        description: Branch or commit to deploy to the VOD test instance
        required: true
        default: codex/vod-management-01-foundation

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_TAG: vod-split-test
  SOURCE_REF: ${{ inputs.source_ref || 'codex/vod-management-01-foundation' }}

jobs:
  prepare:
    runs-on: ubuntu-24.04
    outputs:
      timestamp: ${{ steps.timestamp.outputs.timestamp }}
      image_name: ${{ steps.image.outputs.image_name }}
      source_sha: ${{ steps.source.outputs.source_sha }}
    steps:
      - name: Check out selected source
        uses: actions/checkout@v6
        with:
          ref: ${{ env.SOURCE_REF }}

      - name: Resolve source revision
        id: source
        run: echo "source_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Generate build timestamp
        id: timestamp
        run: echo "timestamp=$(date -u +'%Y%m%d%H%M%S')" >> "$GITHUB_OUTPUT"

      - name: Resolve image name
        id: image
        shell: bash
        run: |
          OWNER="$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')"
          REPOSITORY="$(echo "${{ github.event.repository.name }}" | tr '[:upper:]' '[:lower:]')"
          echo "image_name=${OWNER}/${REPOSITORY}" >> "$GITHUB_OUTPUT"

  build:
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        platform: [amd64, arm64]
        include:
          - platform: amd64
            runner: ubuntu-24.04
          - platform: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.prepare.outputs.source_sha }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push ${{ matrix.platform }} image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./docker/Dockerfile
          platforms: linux/${{ matrix.platform }}
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ needs.prepare.outputs.image_name }}:${{ env.IMAGE_TAG }}-${{ matrix.platform }}
            ${{ env.REGISTRY }}/${{ needs.prepare.outputs.image_name }}:${{ needs.prepare.outputs.source_sha }}-${{ matrix.platform }}
          build-args: |
            REPO_OWNER=dispatcharr
            REPO_NAME=dispatcharr
            BASE_TAG=base
            TIMESTAMP=${{ needs.prepare.outputs.timestamp }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ needs.prepare.outputs.source_sha }}
            org.opencontainers.image.description=Movhika VOD split test image

  create-manifest:
    needs: [prepare, build]
    runs-on: ubuntu-24.04

    steps:
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create multi-architecture manifest
        run: |
          docker buildx imagetools create \
            --annotation "index:org.opencontainers.image.source=https://github.com/${{ github.repository }}" \
            --annotation "index:org.opencontainers.image.revision=${{ needs.prepare.outputs.source_sha }}" \
            --annotation "index:org.opencontainers.image.created=${{ needs.prepare.outputs.timestamp }}" \
            --annotation "index:org.opencontainers.image.description=Movhika VOD split test image" \
            --tag ${{ env.REGISTRY }}/${{ needs.prepare.outputs.image_name }}:${{ env.IMAGE_TAG }} \
            --tag ${{ env.REGISTRY }}/${{ needs.prepare.outputs.image_name }}:${{ needs.prepare.outputs.source_sha }} \
            ${{ env.REGISTRY }}/${{ needs.prepare.outputs.image_name }}:${{ env.IMAGE_TAG }}-amd64 \
            ${{ env.REGISTRY }}/${{ needs.prepare.outputs.image_name }}:${{ env.IMAGE_TAG }}-arm64
